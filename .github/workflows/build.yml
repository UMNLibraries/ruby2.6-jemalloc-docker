---
name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUBY_VERSION=2.6.10
            OPENSSL_VERSION=1.1.1w
            JEMALLOC_VERSION=5.3.0

      - name: Build verification image (load)
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg RUBY_VERSION=2.6.10 \
            --build-arg OPENSSL_VERSION=1.1.1w \
            --build-arg JEMALLOC_VERSION=5.3.0 \
            --load \
            -t "ruby2.6-jemalloc:ci-${{ matrix.arch }}" \
            .

      - name: Verify Ruby and jemalloc runtime
        run: |
          ./scripts/verify-ruby-jemalloc.sh \
            "ruby2.6-jemalloc:ci-${{ matrix.arch }}" \
            "${{ matrix.platform }}"
