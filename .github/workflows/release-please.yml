# see e.g. https://github.com/googleapis/release-please-action
---
name: release-please

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: release-please
        uses: googleapis/release-please-action@v5
        with:
          configuration: .github/release-please-config.json
          release-type: simple
          include-v-in-tag: false
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
